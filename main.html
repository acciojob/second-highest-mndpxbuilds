<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">

<body>	
	<script>
		function secondHighest(arr) {
			//Write your code here
			let max = -Infinity;
			let max2 = -Infinity;
			let occurances = 1;
			for(let i=0; i<arr.length; i++){
				if(arr[i]==arr[i+1]){
					occurances++;
				}
			}
			if(arr.length <=1 && arr.length==occurances){
				return -Infinity; 
			}
			for(let j=0; i<arr.length; i++){
				if(arr[j]>max){
					max = arr[i];
				}
				for(let k=0; k<arr.length; k++){
					if(arr[k]>max2 && arr[j]<max){
						max2 = arr[k];
					}
				}
			}
			return max2;
		}

		function Main() {
			var n = prompt("Enter the number of elements");
			var arr = [];
			for (var i = 0; i < n; i++) {
				arr[i] = prompt("Enter element " + (i+1));
			}

			
			alert(secondHighest(arr)); 
		}
		Main();
	</script>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
