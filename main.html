<!DOCTYPE html>

<body>	
	<script>
		function secondHighest(arr) {
			//Write your code here
			let max = -Infinity;
    let max2 = -Infinity;
    let occurrences = 0;

    if (arr.length === 0 || arr.length === 1) {
        return -Infinity;
    }

    // Check if all elements are same
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] === arr[0]) {
            occurrences++;
        }
    }

    if (occurrences === arr.length - 1) {
        return -Infinity;
    }

    // Find maximum
    for (let j = 0; j < arr.length; j++) {
        if (arr[j] > max) {
            max = arr[j];
        }
    }

    // Find second highest
    for (let k = 0; k < arr.length; k++) {
        if (arr[k] > max2 && arr[k] < max) {
            max2 = arr[k];
        }
    }

    return max2;
		}

		function Main() {
			var n = prompt("Enter the number of elements");
			var arr = [];
			for (var i = 0; i < n; i++) {
				arr[i] = prompt("Enter element " + (i+1));
			}

			
			alert(secondHighest(arr)); 
		}
		Main();
	</script>

    <script type="text/javascript" src="./script.js">
</script>

</body>
